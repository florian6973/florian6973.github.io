{% assign service = site.data.data.service %}
{% if service %}
<section class="section service-section">
  <h2 class="section-title">{{ service.title }}</h2>
  <dl class="def-grid">
    {% for item in service.items %}
    <dt>{{ item.title }}</dt>
    <dd>{{ item.details }}</dd>
    {% endfor %}
  </dl>
</section>
{% endif %}
